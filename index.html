<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Door Sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ink: #4a3b6b;
    --ink-soft: #8a7cab;
    --lilac: #c9b6ff;
    --pink: #ffc6e6;
    --sky: #aee3ff;
    --gold: #ffd978;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: 'Quicksand', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 8%, #fff4fb 0, transparent 45%),
      radial-gradient(circle at 85% 0%, #e6f0ff 0, transparent 45%),
      radial-gradient(circle at 50% 100%, #e9fbf3 0, transparent 50%),
      linear-gradient(180deg, #faf5ff, #fff0f8 60%, #f0f8ff);
    background-attachment: fixed;
    padding: 20px 16px 40px;
  }
  #sparkles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .sparkle {
    position: absolute; color: var(--gold); opacity: 0;
    animation: twinkle var(--d, 4s) ease-in-out var(--delay, 0s) infinite;
    text-shadow: 0 0 8px rgba(255, 217, 120, .8);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); }
    50%      { opacity: .9; transform: scale(1) rotate(45deg); }
  }
  .wrap { position: relative; max-width: 460px; margin: 0 auto; }
  header { text-align: center; margin: 14px 0 22px; }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 2.5rem; margin: 0; letter-spacing: .5px;
    background: linear-gradient(90deg, #9b7bff, #ff8fcf, #ffbf5e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 4px 0 0; color: var(--ink-soft); font-weight: 500; }

  .card {
    background: rgba(255, 255, 255, .72);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .95);
    border-radius: 24px; padding: 20px;
    box-shadow: 0 10px 40px rgba(155, 123, 255, .18), 0 2px 8px rgba(255, 143, 207, .12);
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 14px; font-size: 1rem; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; }
  .val {
    font-weight: 700; font-size: .9rem; color: #7a5cd6;
    background: #efe8ff; padding: 2px 10px; border-radius: 99px; min-width: 44px; text-align: center;
  }

  button { font-family: inherit; cursor: pointer; }
  .btn {
    width: 100%; border: 0; border-radius: 18px; padding: 15px; font-size: 1.05rem; font-weight: 700;
    color: #fff; letter-spacing: .3px;
    background: linear-gradient(135deg, #a98bff, #ff8fcf);
    box-shadow: 0 8px 22px rgba(169, 139, 255, .45);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:active { transform: scale(.97); box-shadow: 0 4px 12px rgba(169, 139, 255, .4); }
  .btn.fire {
    background: linear-gradient(110deg, #ffb347, #ff8fcf, #a98bff, #ffb347);
    background-size: 250% 100%; animation: shimmer 5s linear infinite;
    box-shadow: 0 8px 26px rgba(255, 143, 207, .5);
  }
  @keyframes shimmer { to { background-position: 250% 0; } }
  .btn.ghost {
    background: rgba(255, 255, 255, .8); color: var(--ink-soft); box-shadow: none;
    border: 1px solid #e3d9ff; font-size: .95rem; padding: 11px; margin-top: 12px;
  }

  #status { text-align: center; margin: 12px 0 0; font-size: .9rem; color: var(--ink-soft); min-height: 1.3em; }
  #controls { display: none; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 99px; outline: none;
    background: linear-gradient(90deg, #ffe0f3, #d9c9ff, #bfeaff);
    box-shadow: inset 0 1px 3px rgba(122, 92, 214, .2);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ffe9a8 70%);
    border: 2px solid #fff; box-shadow: 0 0 0 3px rgba(169, 139, 255, .45), 0 0 14px rgba(255, 217, 120, .9);
  }
  input[type=range]::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ffe9a8 70%);
    border: 2px solid #fff; box-shadow: 0 0 0 3px rgba(169, 139, 255, .45), 0 0 14px rgba(255, 217, 120, .9);
  }

  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip {
    border: 1.5px solid #e6dcff; background: rgba(255, 255, 255, .85); color: var(--ink);
    border-radius: 16px; padding: 12px 8px; font-size: .95rem; font-weight: 600;
    transition: all .15s;
  }
  .chip .em { display: block; font-size: 1.5rem; margin-bottom: 2px; }
  .chip.active {
    background: linear-gradient(135deg, #efe6ff, #ffe8f5); border-color: #a98bff;
    box-shadow: 0 0 0 3px rgba(169, 139, 255, .25), 0 6px 16px rgba(169, 139, 255, .25);
  }
  .chip:active { transform: scale(.96); }
  .chip:last-child:nth-child(odd) { grid-column: span 2; }

  @media (prefers-reduced-motion: reduce) {
    .sparkle, .btn.fire { animation: none; }
    .sparkle { opacity: .5; }
  }
</style>
</head>
<body>
<div id="sparkles" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>Magic Door Sign</h1>
    <p>Sprinkle a little pixie dust ✨</p>
  </header>

  <div class="card">
    <button class="btn" id="connect">✨ Connect to DoorSign</button>
    <div id="status">Not connected</div>
  </div>

  <div id="controls">
    <div class="card">
      <h2>🌟 Brightness <span class="val" id="briVal">128</span></h2>
      <input type="range" id="bri" min="0" max="255" value="128">
    </div>

    <div class="card">
      <h2>🎨 Theme</h2>
      <div class="themes" id="themes">
        <button class="chip" data-v="0"><span class="em">🕯️</span>Golden Glow</button>
        <button class="chip" data-v="1"><span class="em">🌈</span>Color Drift</button>
        <button class="chip" data-v="2"><span class="em">🌌</span>Night Sky</button>
        <button class="chip" data-v="3"><span class="em">🎃</span>Halloween</button>
        <button class="chip" data-v="4"><span class="em">🎄</span>Christmas</button>
      </div>
    </div>

    <div class="card">
      <h2>🔔 Volume <span class="val" id="volVal">15</span></h2>
      <input type="range" id="vol" min="0" max="30" value="15">
    </div>

    <button class="btn fire" id="fire">🎆 Launch the Magic</button>
    <button class="btn ghost" id="disconnect">Disconnect</button>
  </div>
</div>

<script>
// ---- sparkles in the background ----
(function () {
  const box = document.getElementById('sparkles');
  const glyphs = ['✦', '✧', '✨', '⋆'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.fontSize = (10 + Math.random() * 16) + 'px';
    s.style.setProperty('--d', (3 + Math.random() * 4) + 's');
    s.style.setProperty('--delay', (Math.random() * 5) + 's');
    box.appendChild(s);
  }
})();

// ---- Bluetooth ----
const SVC  = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UUID = {
  bri:  '6e400002-b5a3-f393-e0a9-e50e24dcca9e',
  anim: '6e400003-b5a3-f393-e0a9-e50e24dcca9e',
  vol:  '6e400004-b5a3-f393-e0a9-e50e24dcca9e',
  fire: '6e400005-b5a3-f393-e0a9-e50e24dcca9e',
};
let device, chars = {};
const $ = id => document.getElementById(id);
const setStatus = t => $('status').textContent = t;

function showTheme(v) {
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', +c.dataset.v === +v));
}

// Bluetooth only allows one write at a time. Dragging a slider fires dozens of
// writes a second, so queue them: one write in flight, and while it's busy only
// the newest value for each control is kept.
const pending = new Map();
let writing = false;
function write(key, value) {
  pending.set(key, value);
  if (!writing) flushWrites();
}
async function flushWrites() {
  writing = true;
  while (pending.size) {
    const [key, value] = pending.entries().next().value;
    pending.delete(key);
    try { await chars[key].writeValue(Uint8Array.of(value)); }
    catch (e) { setStatus('Write failed: ' + e.message); }
  }
  writing = false;
}

$('connect').onclick = async () => {
  if (!navigator.bluetooth) {
    setStatus('Web Bluetooth not supported here. Use Chrome on Android, or Bluefy on iPhone.');
    return;
  }
  try {
    setStatus('Choose your DoorSign...');
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    device.addEventListener('gattserverdisconnected', () => {
      setStatus('Disconnected'); $('controls').style.display = 'none';
    });
    setStatus('Connecting...');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    for (const k of Object.keys(UUID)) chars[k] = await svc.getCharacteristic(UUID[k]);

    // Reading an encrypted characteristic triggers the passkey prompt on first use
    setStatus('Pairing (enter the passkey if prompted)...');
    const read = async k => (await chars[k].readValue()).getUint8(0);
    $('bri').value = await read('bri');  $('briVal').textContent = $('bri').value;
    showTheme(await read('anim'));
    $('vol').value = await read('vol');  $('volVal').textContent = $('vol').value;

    setStatus('Connected to ' + device.name + ' ✨');
    $('controls').style.display = 'block';
  } catch (e) { setStatus('Error: ' + e.message); }
};

$('bri').oninput = e => { $('briVal').textContent = e.target.value; write('bri', +e.target.value); };
$('vol').oninput = e => { $('volVal').textContent = e.target.value; write('vol', +e.target.value); };
$('themes').onclick = e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  showTheme(chip.dataset.v);
  write('anim', +chip.dataset.v);
};
$('fire').onclick = () => write('fire', 1);
$('disconnect').onclick = () => device && device.gatt.disconnect();
</script>
</body>
</html>
